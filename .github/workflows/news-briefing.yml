name: news-briefing-publish

# 예약 작업 세션이 data/news/<kind>.json 브리핑을 main에 푸시하면
# 1) 브리핑 페이지(GitHub Pages)를 갱신하고 2) 카톡으로 알린다.
# 메일·알림·커뮤니티 예약 작업은 workflow_dispatch(kind)로 카톡만 보낸다(페이지는 바뀐 게 없어 배포하지 않음).
on:
  push:
    branches: [main]
    paths: ["data/news/news.json", "data/news/politics.json", "site/**"]
  workflow_dispatch:
    inputs:
      kind:
        description: 카톡을 보낼 브리핑 (비우면 페이지만 갱신)
        type: choice
        options: ["", news, politics, mail, noti]
        default: ""
      note:
        description: "noti: 카톡 본문 (건수만, 알림 내용은 넣지 않음)"
        type: string
        default: ""

concurrency:
  group: news-briefing-publish
  cancel-in-progress: false

jobs:
  pages:
    # 페이지 내용(data/news, site)이 바뀐 푸시, 또는 kind 없이 수동 실행했을 때만
    if: github.event_name == 'push' || inputs.kind == ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: cp data/news/*.json site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # 업로드 직후 배포가 방금 올린 artifact를 못 찾는 일이 가끔 있다("No artifacts named github-pages").
      # GitHub 쪽 반영 지연이라 잠시 뒤 한 번 더 배포한다.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

  notify:
    # 푸시면 페이지 배포 뒤에 보내되, 배포가 실패하거나 건너뛰어도 카톡은 보낸다.
    needs: pages
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # data/briefings 커밋
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send KakaoTalk
        env:
          KINDS: ${{ inputs.kind }}
          NOTI_NOTE: ${{ inputs.note }}
          EVENT: ${{ github.event_name }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_REFRESH_TOKEN_FILE: ${{ runner.temp }}/kakao_refresh_token
        run: |
          if [ "$EVENT" = push ]; then
            KINDS=$(git diff --name-only HEAD~1 HEAD -- data/news | sed -n 's#data/news/\(news\|politics\)\.json#\1#p')
          fi
          for kind in $KINDS; do python -m news.notify "$kind"; done
      - name: Commit data/briefings (알림 로그 앱이 읽음)
        run: |
          [ -n "$(git status --porcelain data/briefings)" ] || exit 0
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add data/briefings && git commit -q -m "briefing file: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - name: Rotate Kakao refresh token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "$RUNNER_TEMP/kakao_refresh_token" ]; then
            gh secret set KAKAO_REFRESH_TOKEN < "$RUNNER_TEMP/kakao_refresh_token"
          fi
