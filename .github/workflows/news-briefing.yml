name: news-briefing

on:
  schedule:
    - cron: "0 0,3,6,9,12 * * *"  # KST 09·12·15·18·21시 — 일반 브리핑
    - cron: "30 23 * * *"         # KST 08:30 — 정치 브리핑
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [news, politics]
        default: news

permissions:
  contents: write

concurrency:
  group: news-briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run briefing
        env:
          KIND: ${{ github.event.schedule == '30 23 * * *' && 'politics' || inputs.kind || 'news' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m news.briefing "$KIND"
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          git diff --cached --quiet || git commit -m "news: ${{ github.event.schedule || inputs.kind }} snapshot"
          git pull --rebase
          git push
