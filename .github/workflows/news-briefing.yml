name: news-briefing-notify

# 예약 작업 세션이 data/news/<kind>.json 브리핑을 main에 푸시하면 카톡으로 알린다.
on:
  push:
    branches: [main]
    paths: ["data/news/news.json", "data/news/politics.json"]
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [news, politics]
        default: news

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send KakaoTalk
        env:
          KINDS: ${{ inputs.kind }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_REFRESH_TOKEN_FILE: ${{ runner.temp }}/kakao_refresh_token
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ -z "$KINDS" ]; then
            KINDS=$(git diff --name-only HEAD~1 HEAD -- data/news | sed -n 's#data/news/\(news\|politics\)\.json#\1#p')
          fi
          for kind in $KINDS; do python -m news.notify "$kind"; done
      - name: Rotate Kakao refresh token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "$RUNNER_TEMP/kakao_refresh_token" ]; then
            gh secret set KAKAO_REFRESH_TOKEN < "$RUNNER_TEMP/kakao_refresh_token"
          fi
